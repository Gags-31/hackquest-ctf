services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hubspot:hubspot@postgres:5432/hubspot
      - MONGO_URL=mongodb://mongo:27017
    depends_on:
      - postgres
      - mongo

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hubspot
      POSTGRES_PASSWORD: hubspot
      POSTGRES_DB: hubspot
    ports:
      - "5432:5432"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
