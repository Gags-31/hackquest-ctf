services:
  - type: web
    name: hackquest-ctf
    env: python
    rootDir: challenges
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hackquest-db
          property: connectionString
    plan: free

databases:
  - name: hackquest-db
    databaseName: hackquest
    user: hackquest
    plan: free
